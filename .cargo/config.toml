# 試験の並列度（RFN01-38の調査、2026-09-21）。
#
# **既定の並列度では、画素を描く試験が止まる。**この機械は論理28 CPUなので既定は
# 28本になり、同じ工程で多くのスレッドが一度にDirectWrite・Direct2D・WICの描画へ
# 入ると、CPUが1秒も動かないまま返ってこない。別Issueで追う。
# **アプリは描くのを1本のスレッドに限っている**（要件 2・技術検証 7.8）ので、
# 製品側で起きる話ではない。
#
# 4本なら1105件が12〜13秒で終わり、緑になる。`cargo test` と打てばこの数になる。
# 数を変えたいときは `cargo test -- --test-threads=1` のように分けて指定する。
[env]
RUST_TEST_THREADS = "4"
